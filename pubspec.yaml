name: zoe_remind
description: "Zoe-Remind — offline-first AI reminder companion by Brixen AI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.3.1
  sqflite: ^2.4.1
  path: ^1.9.0
  go_router: ^18.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo/
    - assets/images/icons/
    - assets\images\backgrounds/
    - assets/images/zoe/idle/
    - assets/images/zoe/happy/
    - assets/images/zoe/thinking/
    - assets/images/zoe/reminding/
    - assets/images/zoe/celebrating/
    - assets/prompts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700